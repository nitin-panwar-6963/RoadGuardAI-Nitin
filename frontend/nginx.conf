server {
    listen 100;
    server_name localhost;

    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Fix 1: Fragile IP (172.17.0.1) hatakar docker service name 'backend' kiya
        # Fix 2: Trailing slash (/) hataya taaki 404 error na aaye report generate hote waqt
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix 3: 600s timeout lagaya YOLO video upload crash rokne ke liye
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://backend:8000; 
        
        # Ye 3 lines WebSocket connection ko zinda rakhti hain
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket timeout badhaya taaki live drone stream beech mein na kate
        proxy_read_timeout 600s;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}